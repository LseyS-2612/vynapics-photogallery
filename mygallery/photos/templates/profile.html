<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Vynapics</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        body { 
            font-family: 'Montserrat', sans-serif; 
            background: linear-gradient(135deg, #112d20 0%, #1a3c34 100%); 
            margin: 0; 
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }
        
        /* Profil Başlık Alanı */
        .profile-header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(0,0,0,0.25);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .profile-header h1 { margin-bottom: 10px; color: white; letter-spacing: 1px; }
        .profile-header p { color: #bbb; margin-bottom: 25px; }

        .btn-group { display: flex; justify-content: center; gap: 15px; }
        .btn-group a {
            text-decoration: none;
            padding: 10px 25px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.3s;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-back { border: 1px solid rgba(255,255,255,0.5); color: white; }
        .btn-back:hover { background: white; color: #112d20; }
        .btn-upload { background: white; color: #112d20; }
        .btn-upload:hover { background: #e0e0e0; transform: translateY(-2px); }

        /* Galeri Düzeni */
        .gallery {
            column-count: 5;
            column-gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Fotoğraf Kartı */
        .photo-card {
            break-inside: avoid;
            margin-bottom: 20px;
            position: relative; /* İkonları yerleştirmek için gerekli */
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }
        .photo-card:hover { transform: translateY(-5px); }
        .photo-card img { width: 100%; display: block; }

        /* YENİ: Fotoğraf Üzerindeki İkonlar (Gizli Başlar) */
        .photo-actions {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
            opacity: 0; /* Başlangıçta görünmez */
            transition: opacity 0.3s ease;
        }
        
        /* Mouse üzerine gelince ikonlar görünsün */
        .photo-card:hover .photo-actions { opacity: 1; }

        /* İkon Butonlarının Stili */
        .action-btn {
            background: rgba(0, 0, 0, 0.6); /* Yarı saydam siyah */
            color: white;
            border: none;
            width: 35px; height: 35px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .action-btn:hover { background: rgba(255, 255, 255, 0.9); color: #112d20; }
        .action-btn.delete:hover { background: #c0392b; color: white; } /* Silme butonu kırmızı olsun */

        /* Mobil */
        @media (max-width: 1024px) { .gallery { column-count: 3; } }
        @media (max-width: 600px) { .gallery { column-count: 2; } }
    </style>
</head>
<body>

    <div class="profile-header">
        <h1>Welcome, {{ user.username }}</h1>
        <p>Manage your portfolio</p>
        
        <div class="btn-group">
            <a href="/" class="btn-back"><span class="material-icons">arrow_back</span> Gallery</a>
            <a href="/add/" class="btn-upload"><span class="material-icons">add_a_photo</span> Upload New</a>
        </div>
    </div>

    <div class="gallery">
        {% for photo in photos %}
        <div class="photo-card">
            <img src="{{ photo.image.url }}" alt="My Photo">
            
            <div class="photo-actions">
                <a href="{% url 'edit_photo' photo.id %}" class="action-btn" title="Edit">
                    <span class="material-icons" style="font-size: 18px;">edit</span>
                </a>

                <form action="{% url 'delete_photo' photo.id %}" method="post" onsubmit="return confirm('Are you sure you want to delete this photo?');">
                    {% csrf_token %}
                    <button type="submit" class="action-btn delete" title="Delete">
                        <span class="material-icons" style="font-size: 18px;">delete</span>
                    </button>
                </form>
            </div>
        </div>
        {% empty %}
        <p style="text-align: center; width: 100%; font-size: 1.1rem; margin-top: 50px; color: #aaa;">
            <span class="material-icons" style="display: block; font-size: 48px; margin-bottom: 10px;">image_not_supported</span>
            You haven't uploaded any photos yet.
        </p>
        {% endfor %}
    </div>

</body>
</html>
